# =============================================================================
# plny_tengu_tools.yml
# Polagony Tengu Tools & Weapons — Oraxen Item Definitions
# Naming convention: plny_tengu_*
# Compatible with Oraxen 1.x / 2.x on Paper/Spigot 1.18–1.21+
# =============================================================================
# NOTES
#  • All weapons use NETHERITE_* base materials for max durability and stats.
#  • Staff and Spear use NETHERITE_HOE / NETHERITE_SWORD as base (visual-only
#    replacements). Adjust material to taste.
#  • Bow pulling models are referenced via vanilla override predicates inside
#    plny_tengu_bow.json — no extra Oraxen mechanic needed.
#  • AttributeModifiers use Bukkit enum names. Oraxen maps them automatically.
# =============================================================================

# ---------------------------------------------------------------------------
# SWORD
# ---------------------------------------------------------------------------
plny_tengu_sword:
  displayname: "<gradient:#8B0000:#FF4500>✦ Tengu Blade</gradient>"
  material: NETHERITE_SWORD
  lore:
    - "<dark_gray>A blade honed on the bones of fallen demons."
    - ""
    - "<gold>⚔ Attack Damage: <yellow>+12"
    - "<gold>⚡ Attack Speed: <yellow>+1.6"
    - ""
    - "<dark_purple><i>✦ Polagony Tengu Set</i>"
  Pack:
    generate_model: false
    model: custom/plny_tengu_sword
  Unbreakable: true
  ItemFlags:
    - HIDE_ATTRIBUTES
    - HIDE_UNBREAKABLE
    - HIDE_ENCHANTS
  AttributeModifiers:
    - attribute: GENERIC_ATTACK_DAMAGE
      amount: 12.0
      operation: ADD_NUMBER
      slot: MAINHAND
    - attribute: GENERIC_ATTACK_SPEED
      amount: 1.6
      operation: ADD_NUMBER
      slot: MAINHAND

