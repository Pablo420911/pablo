# ============================================================
#  Plny Tengu Tool Set  –  Oraxen item definitions
#  Naming prefix : plny_tengu_*
#  CMD range     : 10006 – 10016
#
#  Base material choices explained:
#    NETHERITE_SWORD / AXE / PICKAXE / SHOVEL / HOE
#      → inherits netherite damage/speed and enchantability
#    BOW / CROSSBOW / FISHING_ROD / TRIDENT
#      → vanilla ranged/fishing base with custom model
#    BLAZE_ROD (staff), IRON_SWORD (spear)
#      → neutral materials with custom model + attributes
# ============================================================

# ------------------------------------------------------------------
# SWORD  (CMD 10006)
# ------------------------------------------------------------------
plny_tengu_sword:
  displayname: "<gradient:#FF4500:#8B0000>Tengu Blade</gradient>"
  material: NETHERITE_SWORD
  custom_model_data: 10006
  Pack:
    generate_model: false
    model: custom/plny_tengu_sword
  lore:
    - "<gray>Drinks the blood of enemies."
    - ""
    - "<dark_red>⚔ SET: Plny Tengu"
    - "<dark_red>◈ DAMAGE: +8"
  AttributeModifiers:
    - attribute: GENERIC_ATTACK_DAMAGE
      amount: 1
      operation: ADD_NUMBER
      slot: MAINHAND
      uuid: "e1c10c5e-0000-0002-0001-000000000001"

