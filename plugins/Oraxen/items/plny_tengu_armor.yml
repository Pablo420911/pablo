# =============================================================================
# plny_tengu_armor.yml
# Polagony Tengu Armor Set — Oraxen Item Definitions
# Naming convention: plny_tengu_*
# Compatible with Oraxen 1.x / 2.x on Paper/Spigot 1.18–1.21+
# =============================================================================
# NOTES
#  • NETHERITE_* base materials give full netherite protection by default.
#    Extra attributes below push stats above vanilla netherite.
#  • AttributeModifiers use Bukkit enum names (GENERIC_ARMOR, etc.).
#    Oraxen maps these to the Paper 1.20.5+ registry names automatically.
#  • The helmet model is a full 3D elements-based JSON (with wings).
#    All other armor pieces use item/generated with custom texture.
#  • To enable custom WORN visuals for chest/legs/boots add the
#    Oraxen "Armor" mechanic (see commented section) and supply
#    plugins/Oraxen/pack/textures/models/armor/plny_tengu_layer_1.png
#    and plny_tengu_layer_2.png.
# =============================================================================

# ---------------------------------------------------------------------------
# HELMET + WINGS (merged single item, 3D model)
# ---------------------------------------------------------------------------
plny_tengu_helmet:
  displayname: "<gradient:#8B0000:#FF4500>✦ Tengu Helm</gradient>"
  material: NETHERITE_HELMET
  lore:
    - "<dark_gray>A fearsome helm worn by the Tengu masters."
    - "<dark_gray>The twin wings mark one who has surpassed death."
    - ""
    - "<gold>⚔ Armor: <yellow>+5"
    - "<gold>⚔ Toughness: <yellow>+4"
    - "<gold>❤ Max Health: <yellow>+4"
    - "<gold>✦ Knockback Resist: <yellow>+20%"
    - ""
    - "<dark_purple><i>✦ Polagony Tengu Set</i>"
  Pack:
    generate_model: false
    model: custom/plny_tengu_helmet
  Unbreakable: true
  ItemFlags:
    - HIDE_ATTRIBUTES
    - HIDE_UNBREAKABLE
    - HIDE_ENCHANTS
  AttributeModifiers:
    - attribute: GENERIC_ARMOR
      amount: 5.0
      operation: ADD_NUMBER
      slot: HEAD
    - attribute: GENERIC_ARMOR_TOUGHNESS
      amount: 4.0
      operation: ADD_NUMBER
      slot: HEAD
    - attribute: GENERIC_MAX_HEALTH
      amount: 4.0
      operation: ADD_NUMBER
      slot: HEAD
    - attribute: GENERIC_KNOCKBACK_RESISTANCE
      amount: 0.2
      operation: ADD_NUMBER
      slot: HEAD
  # --- Uncomment to enable custom worn-armor texture (requires armor layer PNGs) ---
  # Mechanics:
  #   Armor:
  #     texture: plny_tengu   # → pack/textures/models/armor/plny_tengu_layer_1.png

