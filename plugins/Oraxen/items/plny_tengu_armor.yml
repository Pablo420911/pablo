# ============================================================
#  Plny Tengu Armor Set  –  Oraxen item definitions
#  Naming prefix : plny_tengu_*
#  CMD range     : 10001 – 10005  (armor + shield)
#  Base materials: NETHERITE_* for stats; SHIELD for shield
#
#  HOW TO USE
#  ----------
#  1. Drop your textures into:
#       plugins/Oraxen/pack/textures/custom/plny_tengu_set/
#     using the exact filenames referenced in the JSON models.
#  2. Drop the JSON models into:
#       plugins/Oraxen/pack/models/custom/
#  3. Restart the server (or use /oraxen reload).
#
#  ATTRIBUTE NOTE
#  --------------
#  NETHERITE_* base materials already carry vanilla netherite
#  stats (helmet 3/3, chest 8/3, legs 6/3, boots 3/3 armor/toughness).
#  The AttributeModifiers below ADD on top of those values so
#  the set is stronger than standard netherite.
#  Remove or adjust them if you want vanilla netherite stats.
# ============================================================

# ------------------------------------------------------------------
# HELMET  (CMD 10001)
# Merged helmet + wings model.  Wings appear on the player's back
# because the wing elements are placed at high-Z in the model
# (Z ≥ 13), which corresponds to the back of the player when worn.
# ------------------------------------------------------------------
plny_tengu_helmet:
  displayname: "<gradient:#FF4500:#8B0000>Tengu War Helm</gradient>"
  material: NETHERITE_HELMET
  custom_model_data: 10001
  Pack:
    generate_model: false
    model: custom/plny_tengu_helmet
  lore:
    - "<gray>Forged in the fires of the demon forge,"
    - "<gray>adorned with the wings of fallen tengu."
    - ""
    - "<dark_red>⚔ SET: Plny Tengu"
    - "<dark_red>◈ ARMOR: 5   TOUGHNESS: 4"
  AttributeModifiers:
    - attribute: GENERIC_ARMOR
      amount: 2
      operation: ADD_NUMBER
      slot: HEAD
      uuid: "e1c10c5e-0000-0001-0001-000000000001"
    - attribute: GENERIC_ARMOR_TOUGHNESS
      amount: 1
      operation: ADD_NUMBER
      slot: HEAD
      uuid: "e1c10c5e-0000-0001-0001-000000000002"

